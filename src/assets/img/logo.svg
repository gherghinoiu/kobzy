<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" role="img" aria-label="Kobzy">
  <!-- Monogram tile -->
  <rect x="2" y="6" width="72" height="72" rx="18" fill="#0f1b2d"/>
  <!-- Stylised K formed from a road/chevron -->
  <path d="M30 24 v36" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M33 42 L52 24" stroke="#e8a33d" stroke-width="7" stroke-linecap="round"/>
  <path d="M33 42 L52 60" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- speed accent -->
  <circle cx="58" cy="62" r="4" fill="#e8a33d"/>

  <!-- Wordmark -->
  <text x="90" y="52" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="900" letter-spacing="1.5" fill="#0f1b2d">KOBZY</text>
  <!-- underline speed line -->
  <rect x="92" y="60" width="150" height="4" rx="2" fill="#e8a33d"/>
</svg>
